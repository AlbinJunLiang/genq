<button mat-icon-button [matMenuTriggerFor]="filterMenu">
  <mat-icon> filter_alt </mat-icon>
</button>

<mat-menu #filterMenu="matMenu">
  <button mat-menu-item disabled class="menu-title">Filtrar quizzes</button>

  <mat-divider></mat-divider>

  <button (click)="filterQuizzesBy('PUBLIC')" mat-menu-item>Públicos</button>
  <button (click)="filterQuizzesBy('PRIVATE')" mat-menu-item>Privados</button>
  <button (click)="filterQuizzesBy('ALL')" mat-menu-item>Todos</button>

  <button mat-menu-item (click)="filterGlobal()">Globales</button>
</mat-menu>
