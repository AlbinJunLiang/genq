<!-- Elimina el <div class="dialog-container"> -->

<h2 mat-dialog-title class="header">
    <span style="font-size: 1.5rem; font-weight: 600; text-align: center; 
      width: 100%">Detalles
        del cuestionario</span>
</h2>
<mat-dialog-content class="message">
    <div class="line">
        <span class="label">Título:</span>
        <span class="value">{{data.title}}</span>
    </div>

    <div class="line">
        <span class="label">Descripción:</span>
        <span class="value">{{data.description}}</span>
    </div>

    <!--

    <div class="line">
        <span class="label">Fecha límite::</span>
        <span class="value">{{formatDate(data.endAt.toString())}}</span>
    </div>



    <div class="line">
        <span class="label">Límite de intentos:</span>
        <span class="value">{{data.attemptsLimit}}</span>
    </div>

    <div class="line">
        <span class="label">Tiempo para completar:</span>
        <span class="value">{{formatDuration(data.durationSeconds)}}</span>
    </div>
    -->

    <div class="line">
        <span class="label">Referencia:</span>
        <span class="value">{{data.uuid}}</span>
    </div>


    <div class="qr-container">
  <!-- El #qrCanvas ahora se vincula automáticamente al viewChild -->
  <canvas #qrCanvas></canvas>
</div>

</mat-dialog-content>


<mat-dialog-actions class="actions">
    <button mat-button mat-dialog-close>Cerrar</button>
<button (click)="openQuiz()" mat-flat-button color="primary" mat-dialog-close>
  <mat-icon>play_arrow</mat-icon>
  <span>Iniciar</span>
</button></mat-dialog-actions>
