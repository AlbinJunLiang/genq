<mat-toolbar
  style="
    background-color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
  "
  color="primary"
>
  <div class="logo-container">
    <img src="rabbit.png" alt="GenQ" class="logo-app" draggable="false" />
    <span class="app-name">GenQ</span>
  </div>

  <div class="center-buttons">
    <button routerLink="/" class="center-button" mat-button>Inicio</button>
    <button routerLink="/quizzes" class="center-button" mat-button>Cuestionarios</button>
    <button class="center-button" mat-button>Historial</button>
    <button class="center-button" mat-button>Información</button>
  </div>

  <div class="right-icons">
    <button mat-icon-button (click)="searchService.setSearching(true)">
      <mat-icon>
        <img src="search.svg" style="width: 24px; height: 24px" />
      </mat-icon>
    </button>
        <app-filter-menu class="toolbar-main-menu"> </app-filter-menu>


    <app-toolbar-main-menu
      class="toolbar-main-menu"
      style="margin-right: 10px"
    ></app-toolbar-main-menu>

  </div>
</mat-toolbar>
