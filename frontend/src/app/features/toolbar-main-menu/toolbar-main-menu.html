<button mat-icon-button [matMenuTriggerFor]="mainMenu">
  <mat-icon>
    <img src="more_vert.svg" style="width: 24px; height: 24px" />
  </mat-icon>
</button>

<mat-menu #mainMenu="matMenu">
  @if (!authService.isLoggedIn()) {
  <button mat-menu-item (click)="openLogin()">{{languageService.translate('LOGIN')}}</button>
  <button mat-menu-item (click)="openRegister()">{{languageService.translate('REGISTER')}}</button>
  <button mat-menu-item (click)="openForgot()">{{languageService.translate('RECOVER_ACCOUNT')}}</button>
  } @else {

  @if (!authService.isEmailVerified()) {

  <button mat-menu-item (click)="openVerificationDialog()">{{languageService.translate('VERIFY_ACCOUNT')}}</button>
  }
  <button mat-menu-item (click)="goToChangePassword()">{{languageService.translate('UPDATE_PASSWORD')}}</button>

  <button (click)="logout()" mat-menu-item>
    <span>{{languageService.translate('LOGOUT')}}</span>
  </button>
  }
  <mat-divider></mat-divider>
  @if(authUserStore.userSyncData()?.user?.role == 'ADMIN'){
  <button mat-menu-item [matMenuTriggerFor]="configMenu">{{languageService.translate('SETTINGS')}}</button>
  }

  <button mat-menu-item [matMenuTriggerFor]="languageMenu">
    <span>{{languageService.translate('LANGUAGES')}}</span>
  </button>
</mat-menu>

<mat-menu [hidden]="authUserStore.userSyncData()?.user?.role == 'ADMIN'"  #configMenu="matMenu">
  <button mat-menu-item routerLink="/models">
    <mat-icon>settings_applications</mat-icon>

    <span>{{languageService.translate('MODELS')}}</span>
  </button>


</mat-menu>




<mat-menu #languageMenu="matMenu">
  <button mat-menu-item (click)="languageService.changeLang('es')">
    @if (languageService.currentLang() === 'es') {
    <mat-icon>check</mat-icon>
    } @else {
    <mat-icon></mat-icon>
    }

    <span>Español</span>
  </button>

  <button mat-menu-item (click)="languageService.changeLang('en')">
    @if (languageService.currentLang() === 'en') {
    <mat-icon>check</mat-icon>
    } @else {
    <mat-icon></mat-icon>
    }

    <span>English</span>
  </button>
</mat-menu>
