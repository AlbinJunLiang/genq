<button mat-icon-button [matMenuTriggerFor]="mainMenu">
  <mat-icon>
    <img src="more_vert.svg" style="width: 24px; height: 24px" />
  </mat-icon>
</button>

<mat-menu #mainMenu="matMenu">
  @if (!authService.isLoggedIn()) {
    <button mat-menu-item (click)="openLogin()">Iniciar Sesión</button>
    <button mat-menu-item (click)="openRegister()">Registrar</button>
    <button mat-menu-item (click)="openForgot()">Recuperar cuenta</button>
  } @else {

    @if (!authService.isEmailVerified()) {
  
    <button mat-menu-item (click)="openVerificationDialog()">Verificar cuenta</button>
    }
    <button mat-menu-item (click)="goToChangePassword()">Cambiar contraseña</button>

    <button (click)="logout()" mat-menu-item>
      <span>Cerrar sesión</span>
    </button>
  }
  <mat-divider></mat-divider>

  <button mat-menu-item>Configuración</button>

  <button mat-menu-item [matMenuTriggerFor]="languageMenu">
    <span>Idiomas</span>
  </button>
</mat-menu>

<mat-menu #languageMenu="matMenu">
  <button mat-menu-item (click)="languageService.changeLang('es')">
    @if (languageService.currentLang() === 'es') {
      <mat-icon>check</mat-icon>
    } @else {
      <mat-icon></mat-icon>
    }

    <span>Español</span>
  </button>

  <button mat-menu-item (click)="languageService.changeLang('en')">
    @if (languageService.currentLang() === 'en') {
      <mat-icon>check</mat-icon>
    } @else {
      <mat-icon></mat-icon>
    }

    <span>English</span>
  </button>
</mat-menu>
