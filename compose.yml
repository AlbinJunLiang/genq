services:
  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
    ports:
      - "${MYSQL_ADDON_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASS}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    working_dir: /app
    volumes:
    - ./backend:/app
    - /app/node_modules
    - ./.env:/app/.env
    ports:
      - "3000:3000"
    environment:
      LOCAL_ADDON_URI: mysql://root:${DB_PASS}@db:3306/genq
      MYSQL_ADDON_URI: ${MYSQL_ADDON_URI}
      MYSQL_ADDON_PORT: ${MYSQL_ADDON_PORT}
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT}
      API_PORT: ${API_PORT}
      ENVIRONMENT: ${ENVIRONMENT}

    depends_on:
      db:
        condition: service_healthy
    command: npm run dev

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    environment:
      - CHOKIDAR_USEPOLLING=true # Ayuda a que el hot-reload detecte cambios en Linux

volumes:
  db_data: